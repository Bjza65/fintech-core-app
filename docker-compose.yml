
services:
  # Base de datos
  postgres:
    image: postgres:18
    container_name: fintech-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi_password_superseguro}
      POSTGRES_DB: ${POSTGRES_DB:-fintech_core}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fintech-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mi_password_superseguro}@postgres:5432/${POSTGRES_DB:-fintech_core}?schema=public"

      JWT_SECRET: ${JWT_SECRET:-local_docker_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:${BACKEND_PORT:-3000}/api"

    container_name: fintech-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
